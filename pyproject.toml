[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-insighter"
version = "0.1.0"
description = "A Python-based macro and cross-asset research platform."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sanghun Kim"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
  "yfinance>=0.2.54,<2",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "jupyter>=1.1,<2", "reportlab>=4.2,<5", "matplotlib>=3.9,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["src*"]
